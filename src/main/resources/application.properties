#Database standard connection info
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bloip?serverTimezone=UTC
spring.datasource.username=bloip2
spring.datasource.password=bloip2
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.show-sql=false

#App specific properties
app.discussionsPerPage=2
app.inboxItemsPerPage=2
app.commentsPerPage=2
app.maxTitleLength=60

#Webpush
app.applicationServerKey=${VAPID_PUBLIC_KEY}
app.vapidPrivateKey=${VAPID_PRIVATE_KEY}
app.webPushRunnerCheckTime=5000
app.webPushCountWindowHours=24
app.webPushMinimumResponseDelayMin=30
app.webPushDailyCountMax=10

#Infrastructure
app.baseUrl = ${BASE_URL}

#s3
app.awsUploadRegion=us-east-1
app.awsUploadBucketName=${AWS_S3_UPLOAD_BUCKET_NAME}
app.awsUploadSecretKey=${AWS_UPLOAD_SECRET_KEY}
app.awsUploadAccessKey=${AWS_UPLOAD_ACCESS_KEY}
app.awsPolicyDurationHours=12
app.awsS3RedirectUrl= ${AWS_S3_REDIRECT_URL}
app.audioCdnRootUrl = ${AUDIO_CDN_ROOT_URL}
app.audioCdnUploadUrl = ${AUDIO_CDN_UPLOAD_URL}
