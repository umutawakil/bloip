<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link id="favicon" rel="icon" type="image/x-icon" href="/images/favicon.ico">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
                integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ=="
                crossorigin="anonymous"
                referrerpolicy="no-referrer">
        </script>
        <script type="text/javascript" src="/shared/bloip.js"></script>
        <link rel="stylesheet" href="/shared/bloip.css" type="text/css">
        <style>
            body {
                font-family: "Helvetica Neue";
                text-align: center;
            }

            hr {
                border: 1px dashed #000;
                color: purple;
            }

            #inbox-total-container {
                margin-bottom: 20px;
                /*padding-right: 30px;*/
            }

            #center-wrap {
                word-wrap: break-word;
                overflow-wrap: break-word;
                padding-top: 20px;
                display: inline-block;
                text-align: center;
                min-width: 320px;
            }

            #inbox-total-container a {
                color: black;
            }

            #logo-container {
                text-align: center;
            }

            #layout-center {
                margin-top: 50px;
                margin-bottom: 25px;
                min-height: 600px;
            }

            footer {
                display: block;
                text-align: center;
                margin-top: 20px;
                padding-bottom: 50px;
                text-decoration: none;
                color: blue;
            }

            #twitter-container {
                margin-top: 30px;
                font-size: 1.5em;
                color: blue;
            }
            #twitter-container a {
                color: blue;
            }
            /** Shared components **/

            .standard-button {
                display: inline-block;
                background-color: black;
                color: white;
                padding: 20px;
                text-align: center;
                text-decoration: none;
                border-radius: 7px;
                font-size: 16px;
                margin: 4px 2px;
                max-width: 200px;
                min-width: 100px;
                cursor: pointer;
            }
            .pagination-button {
                display: inline-block;
                border: 1px solid purple;
                color: purple;
                padding: 20px;
                text-align: center;
                text-decoration: none;
                border-radius: 5px;
                font-size: 1.25em;
                margin: 4px 2px;
                width: 100px;
                cursor: pointer;
            }
        </style>
        <th:block th:if="${isMobile}">
            <style>
                #center-wrap {
                    max-width: 420px;
                }
                #header-rule {
                    margin-bottom: 25px;
                }
                #inbox-total-container {
                    margin-top: 5px;
                    margin-bottom: 15px;
                    padding-right: 5px;
                    font-size: 1.5em;
                }

                #center-wrap {
                    max-width: 320px;
                }

                #layout-center {
                    margin-top: 0px;
                }
            </style>
        </th:block>
    </head>
    <body>
        <div id="center-wrap">
            <header>
                <!--TODO: wrap standard logo in this block then overwrite it in the homepage but don't override it in all other pages -->
                <th:block layout:fragment="header">
                    <div th:replace="fragments/inbox-total.html :: inbox-total"></div>
                    <th:block layout:fragment="logo">
                        <div id="logo-container">
                            <a th:href="${baseUrl}" aria-label="Link to home page">
                                <th:block th:if="${isMobile}">
                                    <img alt="Bloip logo" src="/images/mobile-logo.png"/>
                                </th:block>
                                <th:block th:unless="${isMobile}">
                                    <img alt="Bloip logo" src="/images/logo.png"/>
                                </th:block>
                                <th:block th:if="${isMobile}">
                                    <div id="header-rule">
                                        <hr/>
                                    </div>
                                </th:block>
                            </a>
                        </div>
                    </th:block>
                </th:block>
            </header>

            <main>
                <!-- The meat and potatoes of the layout. Put what you wish to override for each page below -->
                <div id="layout-center">
                    <th:block layout:fragment="content">
                        <!-- Move each pages contents here in individual templates -->
                    </th:block>
                </div>
            </main>

            <footer>
                <!--<HR/>-->
                <!--<div id="suggestion-box">
                    <a href="/d/suggestion-box">Suggestion Box</a>
                </div>-->

                <!--<div style="font-size: 1.5em; color: black;" th:text="${'Users Online: ' + numOfUsersOnline}"></div>-->

                <div id="twitter-container">
                    <a href="https://www.twitter.com/BloipApp" target="_blank"><BR/>
                        <div>Follow us on Twitter</div><BR/>
                        <img src="/images/twitter.png" alt="Link to the Bloip twitter page"/>
                    </a>
                </div>
            </footer>
        </div>
    </body>
</html>
