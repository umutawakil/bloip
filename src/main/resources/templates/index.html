<!DOCTYPE html>
<html layout:decorate="~{layouts/main-layout.html}">
    <head>
        <title>Use your mic</title>
        <style>
            #topics-container {
                min-height: 600px;
            }
            #topics-header {
                margin-top: 35px;
                text-align: center;
            }

            #topics-description {
                font-size: 1.5em;
                margin-top: 60px;
            }
            #new-discussion-button-container {
                margin-top: 20px;
                margin-bottom: 0px;
                text-align: center;
            }
            #new-discussion-button {

            }
            .topic-element-container {
                display: inline-block;
                margin-right: 40px;
                color: black;
            }
                .unselected-topic a:link {
                    text-decoration: none;
                    color: black;
                }
                .unselected-topic a:visited {
                    text-decoration: none;
                    color: black;
                }
                .unselected-topic a:active {
                    text-decoration: none;
                    color: black;
                }
                .selected-topic a {
                    text-decoration: underline;
                    color: purple;
                    font-size: 2em;
                }
                .unselected-topic a:hover {
                    text-decoration: underline;
                    cursor: pointer;
                }

            .topic-discussion {
                margin-bottom: 35px;
            }
            .topic-discussion-title {
                font-size: 1.5em;
            }
            .topic-discussion-comment {
                font-size: 1.5em;
            }
            .new-discussion-button {
                display: inline-block;
                background-color: white;
                padding: 20px;
                text-align: center;
                border: 1px solid black;
                border-radius: 50%;
                font-size: 16px;
                margin: 4px 2px;
                cursor: pointer;
                box-shadow: 2.5px 5px;
            }
            .new-discussion-button:hover {
                background-color: mediumpurple;
                color: white;
            }
            .topic-column {
                text-align: center;
                display: inline;
            }

            /** All the styling needed for the miniplayers **/
            .home-stop-button {
                display: none;
                cursor: pointer;
            }
            .home-play-button {
                cursor: pointer;
            }
        </style>

        <th:block th:if="${isMobile}">
            <style>
                #topics-header {
                    margin-top: 10px;
                }
                .topic-element-container {
                    display: block;
                    margin-right: 0px;
                }

                .selected-topic a {
                    font-size: 4em;
                }
                .unselected-topic a {
                    font-size: 3em;
                }

                #topics-description {
                    font-size: 1.5em;
                    margin-top: 30px;
                }
                .topic-discussion-title {
                    font-size: 1.5em;
                }
                .topic-discussion-comment {
                    font-size: 1.5em;
                }
                topic-discussion-title
            </style>
        </th:block>
        <script type="text/javascript">
            function homePlay(id) {
                $("#play-"+id).css("display", "none");
                document.getElementById("audio-"+id).play();
                $("#stop-"+id).css("display", "inline");
            }
            function homeStop(id) {
                $("#stop-"+id).css("display", "none");
                document.getElementById("audio-"+id).pause();
                document.getElementById("audio-"+id).currentTime = 0;
                $("#play-"+id).css("display", "inline");
            }
        </script>
    </head>
    <body>
        <th:block layout:fragment="content">
            <div id="topics-container">
                <div>
                    <div id="topics-header">
                        <p id="topics-description">
                            What are your thoughts on something important?
                        </p>
                    </div>

                    <div id="new-discussion-button-container">
                        <a th:href="'/new-discussion/'">
                            <div id="new-discussion-button" class="new-discussion-button">
                                <img src="/images/mic-medium.png">
                                <BR/>
                                <span>Record</span>
                            </div>
                        </a>
                    </div>
                </div>
                <BR/>
                <HR/>
                <div id="topic-container-divider" style="margin-top: 40px;"></div>
                <div th:if="${discussions.size() == 0}">
                    <span style="margin-top: 20px; padding-top: 40px; font-size: 1.25em; text-align: center;">
                        There are no current discussions in this topic. To help us out click the microphone above.
                    </span>
                </div>
                <div th:each="d: ${discussions}" class="topic-discussion">
                    <div class="topic-column">
                        <div>
                            <a th:href="${d.getUrl()}">
                                <span class="topic-discussion-title" th:text="${d.title}"/>
                            </a>
                        </div>
                        <BR/>
                        <div>
                            <audio th:attr="id='audio-'+${d.id}, onended='homeStop('+${d.id}+')'" preload="metadata" controls style="display: none">
                                <source th:attr="src=${d.audioUrl}" type="audio/mp4">
                                Your browser does not support the audio element.
                            </audio>
                            <img class="home-play-button" th:attr="onclick='homePlay('+${d.id}+')',id='play-'+${d.id}" src="/images/play-button.png">
                            <img class="home-stop-button" th:attr="onclick='homeStop('+${d.id}+')',id='stop-'+${d.id}" src="/images/stop-button.png">
                        </div>
                        <BR/>
                        <div>
                            <a class="topic-discussion-comment" th:href="${d.getUrl()}">
                                <span>Comments(</span><span th:text="${d.numberOfReplies}"/><span>)</span>
                            </a>
                        </div>
                        <BR/>
                        <BR/>
                        <div th:text="${'Updated: ' + d.updateTimestamp}"></div>
                        <BR/>
                        <HR/>
                    </div>
                </div>
                <div>
                    <span th:if="${previousOffsetKey != null}"><a th:href="'?o=' +${previousOffsetKey} + '&d=-1'"><div class="pagination-button">PREVIOUS</div></a></span>
                    <span th:if="${nextOffsetKey != null}"><a th:href="'?o=' +${nextOffsetKey} + '&d=1'"><div class="pagination-button">NEXT</div></a></span>
                </div>
            </div>
        </th:block>
    </body>
</html>
