<!DOCTYPE html>
<html id="homepage" layout:decorate="~{layouts/main-layout.html}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head th:attr="lang=${session.language.code}">
        <title th:text="${bodyTranslations['meta-title']}"/>
        <meta name="description" th:content="${bodyTranslations['meta-description']}"/>

        <!--Twitter specific -->
        <meta name="twitter:card" content="summary">
        <meta name="twitter:site" content="@BloipApp" />
        <meta name="twitter:title" th:content="${bodyTranslations['meta-title']}"/>
        <meta name="twitter:description" th:content="${bodyTranslations['meta-description']}"/>
        <meta name="twitter:image" th:content="${mscCdn + '/images/short-logo.png'}"/>

        <!--Open Graph -->
        <meta property="og:locale" th:content="${session.language.code}"/>
        <meta property="og:site_name" content="Bloip">
        <meta property="og:type" content="article">
        <meta property="og:title" th:content="${bodyTranslations['meta-title']}"/>
        <meta property="og:description" th:content="${bodyTranslations['meta-description']}"/>
        <meta property="og:image" th:content="${mscCdn + '/images/short-logo.png'}"/>
        <meta property="og:image:width" content="188">
        <meta property="og:image:height" content="190">

        <link rel="canonical" th:href="${baseUrl}">
        <th:block layout:replace="fragments/base-meta.html :: baseMetaContent" th:remove="tag"></th:block>
        <style>
            #topics-container {
                min-height: 600px;
            }
            #topics-header {
                margin-top: 35px;
                text-align: center;
            }

            #topics-description {
                font-size: 2em;
                margin-top: 40px;
            }
            #new-discussion-button-container {
                /*margin-top: 10px;*/
                margin-bottom: 0px;
                text-align: center;
            }
            #new-discussion-button {

            }
            .topic-element-container {
                display: inline-block;
                margin-right: 40px;
                color: black;
            }
                .unselected-topic a:link {
                    text-decoration: none;
                    color: black;
                }
                .unselected-topic a:visited {
                    text-decoration: none;
                    color: black;
                }
                .unselected-topic a:active {
                    text-decoration: none;
                    color: black;
                }
                .selected-topic a {
                    text-decoration: underline;
                    color: purple;
                    font-size: 2em;
                }
                .unselected-topic a:hover {
                    text-decoration: underline;
                    cursor: pointer;
                }

            .topic-discussion {
                margin-bottom: 65px;
            }
            .topic-discussion-title {
                font-size: 1.5em;
            }
            .topic-discussion-comment {
                font-size: 1.5em;
            }
            .new-discussion-button {
                display: inline-block;
                background-color: white;
                padding: 20px;
                text-align: center;
                border: 1px solid black;
                border-radius: 50%;
                font-size: 16px;
                margin: 4px 2px;
                cursor: pointer;
                box-shadow: 2.5px 5px;
            }
            .new-discussion-button:hover {
                background-color: mediumpurple;
                color: white;
            }
            .topic-column {
                text-align: center;
                display: inline;
            }

            /** All the styling needed for the miniplayers **/
            .home-stop-button {
                display: none;
                cursor: pointer;
            }
            .home-play-button {
                cursor: pointer;
            }
        </style>

        <th:block th:if="${isMobile}">
            <style>
                #topics-header {
                    margin-top: 10px;
                }
                .topic-element-container {
                    display: block;
                    margin-right: 0px;
                }

                .selected-topic a {
                    font-size: 4em;
                }
                .unselected-topic a {
                    font-size: 3em;
                }

                #topics-description {
                    font-size: 1.5em;
                    margin-top: 30px;
                }
                .topic-discussion-title {
                    font-size: 1.5em;
                }
                .topic-discussion-comment {
                    font-size: 1.5em;
                }
            </style>
        </th:block>
        <script type="text/javascript">
            function homePlay(id) {
                $("#play-"+id).css("display", "none");
                document.getElementById("audio-"+id).play();
                $("#stop-"+id).css("display", "inline");
            }
            function homeStop(id) {
                $("#stop-"+id).css("display", "none");
                document.getElementById("audio-"+id).pause();
                document.getElementById("audio-"+id).currentTime = 0;
                $("#play-"+id).css("display", "inline");
            }
            $(document).ready(function(){
                $("#languages").change(function() {
                    window.location.href = "/?l=" + document.getElementById('languages').value
                });

                var referer = sessionStorage.getItem("referer");
                if(referer) {
                    sessionStorage.removeItem("referer");
                    if (referer.indexOf("bloip-login") === -1) {
                       // window.location.href = referer;
                    }
                    //window.location.href = referer;
                }

                resizeFlag();
            });

            function resizeFlag() {
                var image          = document.getElementById("flag");
                var originalHeight = image.naturalHeight;
                var originalWidth  = image.naturalWidth;

                var desiredHeight  = 40
                var percentChange  = desiredHeight / originalHeight;
                var newWidth       = originalWidth * percentChange;

                $("#flag").width(newWidth);
                $("#flag").height(desiredHeight);
            }
        </script>
    </head>
    <body>
        <th:block layout:fragment="content">
            <div id="topics-container">
                <div>
                    <div id="topics-header">
                        <!--<p id="topics-description" th:text="${bodyTranslations['description']}"></p>-->
                        <div id="topics-description" th:text="${bodyTranslations['slogan']}"></div>
                    </div>
                    <div th:include="fragments/communication-context.html :: communication-context"></div>
                    <div id="new-discussion-button-container">
                        <a id="new-discussion-link" th:href="${'/new-discussion'}">
                            <div id="new-discussion-button" class="new-discussion-button">
                                <img th:src="${mscCdn + '/images/mic-medium.png'}">
                                <BR/>
                                <span th:text="${bodyTranslations['record-button-text']}"></span>
                            </div>
                        </a>
                    </div>
                </div>
                <BR/>
                <HR/>
                <div id="topic-container-divider" style="margin-top: 40px;"></div>
                <div th:if="${discussions.size() == 0}">
                    <span th:text="${bodyTranslations['no-discussions-message']}"style="margin-top: 20px; padding-top: 40px; font-size: 1.25em; text-align: center;"></span>
                </div>
                <div th:each="d: ${discussions}" class="topic-discussion">
                    <div class="topic-column">
                        <div class="topic-discussion-title">
                            <a th:href="${d.getUrl()}" th:text="${d.title + ' (#'+(d.numberOfReplies + 1)+')'}"></a>
                        </div>
                        <BR/>
                        <div>
                            <audio th:attr="id='audio-'+${d.id}, onended='homeStop('+${d.id}+')'" preload="metadata" controls style="display: none">
                                <source th:attr="src=${d.audioUrl}">
                                Your browser does not support the audio element.
                            </audio>
                            <img class="home-play-button" th:attr="onclick='homePlay('+${d.id}+')',id='play-'+${d.id}" th:src="${mscCdn + '/images/play-button.png'}">
                            <img class="home-stop-button" th:attr="onclick='homeStop('+${d.id}+')',id='stop-'+${d.id}"  th:src="${mscCdn + '/images/stop-button.png'}">
                        </div>
                        <BR/>
                        <div>
                            <a class="topic-discussion-comment" th:href="${d.getUrl()}">
                                <span th:text="${bodyTranslations['comments-text'] +' ('}">(</span><span th:text="${d.numberOfReplies}"/><span>)</span>
                            </a>
                        </div>
                        <BR/>
                        <BR/>
                        <div th:text="${bodyTranslations['updated-text'] + ': ' + d.updateTimestamp}"></div>
                        <BR/>
                        <HR/>
                    </div>
                </div>
                <div>
                    <span th:if="${previousOffsetKey != null}"><a th:href="'?o=' +${previousOffsetKey} + '&d=-1&l='+${language.code}"><div class="pagination-button" th:text="${bodyTranslations['previous-button']}"></div></a></span>
                    <span th:if="${nextOffsetKey != null}"><a th:href="'?o=' +${nextOffsetKey} + '&d=1&l='+${language.code}"><div class="pagination-button" th:text="${bodyTranslations['next-button']}"></div></a></span>
                </div>
            </div>
        </th:block>
    </body>
</html>
