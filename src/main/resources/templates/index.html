<!DOCTYPE html>
<html layout:decorate="~{layouts/main-layout.html}">
    <head>
        <title>Topics of discussion</title>
        <style>
            #all-discussions {
                margin-top: 25px;
                font-size: 1.25em;
            }

            #home-discussions {
                margin-top: 15px;
            }

            #home-center-container {
                margin-top: 0px;
                text-align: center;
            }
                #home-center-container a {
                    color: black;
                }
                    #home-center-container a:link {
                        text-decoration: none;
                    }

                    #home-center-container a:visited {
                        text-decoration: none;
                    }

                    #home-center-container a:hover {
                        text-decoration: underline;
                    }

                    #home-center-container a:active {
                        text-decoration: none;
                    }

                    #category-table {
                        display: inline-block;
                    }

            .home-topics {
                margin-top: 10px;
            }
            #category-table {
                border: 0px;
                margin-top: 30px;
                margin-bottom: 20px;
            }
            #category-table tr {
                border-radius: 10px;

            }
            #category-table tr td {
                padding-bottom: 10px;
                border: 1px solid black;
                padding-left: 10px;
                padding-right: 10px;
                vertical-align: middle;
            }
            #home-description {
                margin-top: 30px;
            }
        </style>
    </head>
    <body>
        <th:block layout:fragment="content">
            <div id="home-center-container">
                <div id="home-description">Choose a category below to start or join an audio conversation.</div>
                <div id="home-discussions">
                    <table id="category-table">
                    <tr class="home-topics" th:each="t: ${topics}">
                        <td>
                            <div>
                                <a th:href="'/b/' + ${t.friendlyId}">
                                    <img src="/images/mic-small.png">
                                </a>
                            </div>
                        </td>

                        <td>
                            <a th:href="'/b/' + ${t.friendlyId}">
                                <span th:text="${t.name} + '(' + ${t.count} + ')'"/>
                            </a>
                        </td>
                    </tr>
                    </table>
                </div>
                <BR/>
            </div>
        </th:block>
    </body>
</html>
