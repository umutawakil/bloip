<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Topics of discussion</title>
    </head>
    <style type="text/css">
        #home-center-container {
            text-align: center;
        }
    </style>
    <body>
    <div id="home-center-container">
        <H1>Bloip!</H1>
        <p>
            Choose a topic to start an audio conversation.
        </p>
        <HR/>
        <div th:each="t: ${topics}">
            <B>
                <a th:href="'/b/' + ${t.friendlyId}">
                    <span th:text="${t.name} + '(' + ${t.count} + ')'"/>
                </a>
            </B>
            <BR/>
            <BR/>
        </div>
        <BR/>
    </div>
    </body>
</html>
