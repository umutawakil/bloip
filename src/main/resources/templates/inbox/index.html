<!DOCTYPE html>
<html layout:decorate="~{layouts/main-layout.html}">
    <head>
        <title th:text="${bodyTranslations['inbox']}">Inbox</title>
        <th:block layout:replace="fragments/base-meta.html :: baseMetaContent" th:remove="tag"></th:block>
        <style>
            #inbox-total-container {
                display: none;
            }
            #inbox-container {
                margin-top: 0px;
            }
            .inbox-row {
                padding-top: 0px;
                margin-bottom: 0px;
                font-size: 1.5em;
            }
            .inbox-title {
                margin-left: 20px;
                margin-right: 20px;
            }
            .inbox-controls {
                padding-bottom: 0px;
                padding-top: 0px;
                margin-top: 10px;
            }
            .inbox-controls button {
                margin-bottom: 10px;
                font-size: 0.75em;
            }

            #empty-inbox {
                font-size: 2em;
                margin-top: 0px;
            }

            .pagination-button {
                margin-top: 40px;
            }
        </style>
        <script type="text/javascript">
            function toggleInboxSubscription(self, discussionId) {
                var subscribed = $(self).text() === "Unsubscribe"
                if(subscribed) {
                    $(self).text("Subscribe");
                    sendInboxCommand("/inbox/unsubscribe-inbox/", discussionId);
                } else {
                    $(self).text("Unsubscribe");
                    sendInboxCommand("/inbox/subscribe-inbox/", discussionId);
                }
            }
            function deleteFromInbox(self, discussionId) {
                $("#" + discussionId).remove();
                sendInboxCommand("/inbox/delete-inbox/", discussionId);
            }
            function sendInboxCommand(urlFragment, discussionId) {
                $.ajax({
                    type: "post",
                    url: urlFragment +discussionId,
                    success: function (data) {
                    }
                });
            }
        </script>
    </head>
    <body>
        <th:block layout:fragment="content">
            <H1 th:text="${bodyTranslations['inbox']}"></H1>
            <HR/>
            <table id="inbox-container">
                <div class="inbox-row" th:each="i: ${inbox}" th:attr="id=${i.discussionId}">
                    <BR/>
                    <div class="inbox-title inbox-first-row">
                        <a th:href="'/d/' + ${i.discussionId} +'/l/'+${language.code}+'?currentTrack=' +${i.trackNumber}" th:text="${i.title}"/>
                    </div>

                    <BR/>
                    <div class="inbox-count-cell"  th:text="${bodyTranslations['new-comments']+': ' + i.count}"></div>

                    <!--<div class="inbox-track-number" style="display: inline-block"><a th:href="'/d/' + ${i.discussionId} +'?currentTrack=' +${i.trackNumber}" th:text="'Track #' +${i.trackNumber}"/></div>-->
                    <div class="inbox-controls">
                        <button th:attr="onclick=${'toggleInboxSubscription(this,' + i.discussionId + ')'}" th:text="${bodyTranslations['leave-conversation']}"></button>
                    </div>
                    <HR/>
                </div>
            </table>

            <th:block th:if="${inbox.size == 0 && (nextOffsetKey!= null)}">
                <div id="empty-inbox">
                    <p th:text="${bodyTranslations['empty-inbox']}"></p>
                </div>
            </th:block>

            <div>
                <span th:if="${previousOffsetKey != null}"><a th:href="'/inbox?o=' +${previousOffsetKey} "><div th:text="${bodyTranslations['previous']}" class="pagination-button">PREVIOUS</div></a></span>
                <span th:if="${nextOffsetKey != null}"><a th:href="'/inbox?o=' +${nextOffsetKey} "><div class="pagination-button" th:text="${bodyTranslations['next']}">NEXT</div></a></span>
            </div>
        </th:block>
    </body>
</html>
