<th:block layout:fragment="baseMetaContent" th:remove="tag">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" type="image/x-icon" th:href="${mscCdn + '/images/favicon.ico'}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
            integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer">
    </script>
    <script type="text/javascript" th:attr="src=${mscCdn +'/shared/bloip.js'}" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="${mscCdn +'/shared/bloip.css'}" type="text/css">
    <style>
        body {
            font-family: "Helvetica Neue";
            text-align: center;
        }

        hr {
            border: 1px dashed #000;
            color: purple;
        }

        #inbox-total-container {
            margin-bottom: 20px;
            /*padding-right: 30px;*/
        }

        #center-wrap {
            word-wrap: break-word;
            overflow-wrap: break-word;
            padding-top: 20px;
            display: inline-block;
            text-align: center;
            min-width: 320px;
        }

        #inbox-total-container a {
            color: black;
        }

        #logo-container {
            text-align: center;
        }

        #layout-center {
            margin-top: 50px;
            margin-bottom: 25px;
            min-height: 600px;
        }

        footer {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding-bottom: 50px;
            text-decoration: none;
            color: blue;
        }

        #twitter-container {
            margin-top: 30px;
            font-size: 1.5em;
            color: blue;
        }
        #twitter-container a {
            color: blue;
        }
        /** Shared components **/

        .standard-button {
            display: inline-block;
            background-color: black;
            color: white;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            border-radius: 7px;
            font-size: 16px;
            margin: 4px 2px;
            max-width: 200px;
            min-width: 100px;
            cursor: pointer;
        }
        .pagination-button {
            display: inline-block;
            border: 1px solid purple;
            color: purple;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.25em;
            margin: 4px 2px;
            width: 100px;
            cursor: pointer;
        }
    </style>
    <th:block th:if="${isMobile}">
        <style>
            #center-wrap {
                max-width: 420px;
            }
            #header-rule {
                margin-bottom: 25px;
            }
            #inbox-total-container {
                margin-top: 5px;
                margin-bottom: 15px;
                padding-right: 5px;
                font-size: 1.5em;
            }

            #center-wrap {
                max-width: 320px;
            }

            #layout-center {
                margin-top: 0px;
            }
        </style>
    </th:block>

</th:block>
