<!DOCTYPE html>
<html layout:decorate="~{layouts/main-layout.html}">
    <head>
        <title>Reset password</title>
        <th:block layout:replace="fragments/base-meta.html :: baseMetaContent" th:remove="tag"></th:block>
        <style>
            #inbox-total-container {
                display: none;
            }
            #forgot-my-password-form-container {
                font-size: 1.25em;
            }
            input {
                font-size: 1.25em;
            }
            .messageBox {
                border-radius: 7px;
                padding: 20px;
                font-size: 1.25em;
            }
        </style>
        <script type="text/javascript">

            $(document).ready(function() {
                $("#password-form").submit(function(e) {
                    if ($("#password").val() !== $("#password2").val()) {
                        e.preventDefault();
                        alert("Passwords do not match!");
                    }
                });
            });

        </script>
    </head>
    <body>
        <th:block layout:fragment="content">
            <H1>Reset password</H1>
            <HR/>
            <div id="error" th:if="${error}" class="messageBox" style="color: red;">
                Your password reset has expired. Try sending a new one <a href="/bloip-forgot-my-password">Forgot my password</a>
            </div>
            <div th:unless="${error}">
                <form id="password-form" action="/bloip-reset-my-password" method="post">
                    <BR/>
                    <input id="password" type="password" name="password" minlength="8" maxlength="20" placeholder="Enter new password" required>
                    <BR>
                    <BR>
                    <input id="password2" type="password" name="passwordReentered" minlength="8" maxlength="20" placeholder="Re-enter password" required>
                    <BR>
                    <input type="hidden" name="t" th:value="${token}">
                    <BR/>
                    <input id="submit-button" type="submit" value="Save new password">
                </form>
            </div>
        </th:block>
    </body>
</html>
