<!DOCTYPE html>
<html layout:decorate="~{layouts/main-layout.html}">
    <head>
        <title th:text="${dictionary['reset-password']}"></title>
        <th:block layout:replace="fragments/base-meta.html :: baseMetaContent" th:remove="tag"></th:block>
        <style>
            #inbox-total-container {
                display: none;
            }
            #forgot-my-password-form-container {
                font-size: 1.25em;
            }
            input {
                font-size: 1.25em;
            }
            .messageBox {
                border-radius: 7px;
                padding: 20px;
                font-size: 1.25em;
            }
        </style>
        <script type="text/javascript">

            $(document).ready(function() {
                $("#password-form").submit(function(e) {
                    if ($("#password").val() !== $("#password2").val()) {
                        e.preventDefault();
                        alert($("#not-matching").text());
                    }
                });
            });

        </script>
    </head>
    <body>
        <th:block layout:fragment="content">
            <span id="not-matching" style="display: none" th:text="${dictionary['not-matching']}"/>
            <H1 th:text="${dictionary['reset-password']}"></H1>
            <HR/>
            <form id="password-form" action="/bloip-reset-my-password" method="post">
                <BR/>
                <input id="password" type="password" name="password" minlength="8" maxlength="20" th:attr="placeholder=${dictionary['enter-new-password']}"required>
                <BR>
                <BR>
                <input id="password2" type="password" name="passwordReentered" minlength="8" maxlength="20" th:attr="placeholder=${dictionary['re-enter-password']}" required>
                <BR>
                <input type="hidden" name="t" th:value="${token}">
                <BR/>
                <input id="submit-button" type="submit" th:value="${dictionary['save-new-password']}">
            </form>

        </th:block>
    </body>
</html>
