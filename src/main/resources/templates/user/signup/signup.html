<!DOCTYPE html>
<html layout:decorate="~{layouts/main-layout.html}">
    <head>
        <title>Create an account</title>
        <th:block layout:replace="fragments/base-meta.html :: baseMetaContent" th:remove="tag"></th:block>
        <style>
            #inbox-total-container {
                display: none;
            }
            form {
                font-size: 1.25em;
            }
            label {
                margin-bottom: 10px;
            }
            input {
                text-align: center;
                font-size: 1.25em;
            }
        </style>
        <script type="text/javascript">
            $(document).ready(function() {
                $("#signup-form").submit(function(e) {
                    if ( $("#email1").val() !== $("#email2").val()) {
                        e.preventDefault();
                        alert("The email addresses you entered do not match");
                        return;
                    }
                });
            });
        </script>
    </head>
    <body>
        <th:block layout:fragment="content">
            <H1>Create an account</H1>
            <HR/>
            <BR/>
            <div id="error" th:if="${error == 1}" style="color: red; font-size: 1.5em;">
                <p>
                    That email address is already in use. Try <a href="/bloip-login">logging in</a>
                </p>
            </div>
            <div id="success" th:if="${success == 1}" style="color: green; font-size: 1.5em;">
                <p>A confirmation email has been sent to your email address.</p>
                <p> Click the link in the email to complete your account.</p>
            </div>
            <div th:if="${success != 1}">
                <form id="signup-form" action="/account-confirmation-email" method="post">
                    <input id="email1" type="email" name="email" placeholder="Email address" required>
                    <BR/>
                    <BR/>
                    <input id="email2" name="email2" type="email" placeholder="Re-enter email address" required autocomplete="off">
                    <BR/>
                    <BR/>
                    <label>I am an adult in my country</label>
                    <input id="adult-checkbox" type="checkbox" name="adult" required>
                    <BR>
                    <BR/>
                    <input id="submit-button" type="submit" value="Create new account">
                </form>
            </div>
        </th:block>
    </body>
</html>
