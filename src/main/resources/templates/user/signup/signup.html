<!DOCTYPE html>
<html layout:decorate="~{layouts/main-layout.html}">
    <head>
        <title th:text="${dictionary['create-an-account']}"></title>
        <th:block layout:replace="fragments/base-meta.html :: baseMetaContent" th:remove="tag"></th:block>
        <style>
            #inbox-total-container {
                display: none;
            }
            form {
                font-size: 1.25em;
            }
            label {
                margin-bottom: 10px;
            }
            input {
                text-align: center;
                font-size: 1.25em;
            }
        </style>
        <script type="text/javascript">
            $(document).ready(function() {
                $("#signup-form").submit(function(e) {
                    if ( $("#email1").val() !== $("#email2").val()) {
                        e.preventDefault();
                        alert($("#not-matching").text());
                        return;
                    }
                });
            });
        </script>
    </head>
    <body>
        <th:block layout:fragment="content">
            <span id="not-matching" style="display: none" th:text="${dictionary['not-matching']}"/>
            <H1 th:text="${dictionary['already-created']}"></H1>
            <HR/>
            <BR/>
            <div id="error" th:if="${error == 1}" style="color: red; font-size: 1.5em;">
                <p th:text="${dictionary['email-in-use']}"></p>
                <p><a th:text="${dictionary['login']}" href="/bloip-login"></a></p>
            </div>
            <div id="success" th:if="${success == 1}" style="color: green; font-size: 1.5em;">
                <p th:text="${dictionary['confirmation-sent']}"></p>
                <p th:text="${dictionary['click-link']}"></p>
            </div>
            <div th:if="${success != 1}">
                <form id="signup-form" action="/account-confirmation-email" method="post">
                    <input id="email1" type="email" name="email" th:attr="placeholder=${dictionary['email-address']}" required>
                    <BR/>
                    <BR/>
                    <input id="email2" name="email2" type="email" th:attr="placeholder=${dictionary['re-enter-email-address']}" required autocomplete="off">
                    <BR/>
                    <BR/>
                    <label th:text="${dictionary['i-am-an-adult']}"></label>
                    <input id="adult-checkbox" type="checkbox" name="adult" required>
                    <BR>
                    <BR/>
                    <input id="submit-button" type="submit" th:value="${dictionary['create-new-account']}">
                </form>
            </div>
        </th:block>
    </body>
</html>
