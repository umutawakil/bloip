<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>+New Discussion</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- Audio related modules -->
    <script type="text/javascript" src="/recording/wasm/bloip.js"></script>
    <!--<script type="module" src="/recording/wasm/vmsg.js"></script>-->
    <!--<script type="module" src="/recording/wasm/wasmWrapper.js"></script>-->

    <script type="text/javascript" src="/recording/state-machine/shared/stateMachine.js"></script>
    <script type="module" src="/recording/state-machine/shared/states.js"></script>

    <script type="module" src="/recording/state-machine/createDiscussionFsm.js"></script>
    <script type="module" src="/recording/state-machine/replyFsm.js"></script>

    <style type="text/css">
        .vmsg-backdrop {
            display: none;
        }
    </style>
</head>
<body>
    <!-- State: Discussion info collection -->
    <div id="discussion-info-state-view" style="display: none">
        <div id="discussion-info-display-container">
            <H1>What title do you want for your discussion?</H1>
            <form id="discussion-title-form">
                <label for="discussion-title">Discussion Title</label><br><BR/>
                <input id="discussion-title" type="text" name="title" placeholder="Enter a title for your topic" size="50" maxlength="100">
                <BR/>
            </form>
            <BR/>
            <button id="discussion-info-submit-button">Submit</button>
            <BR/>
            <BR>
        </div>
    </div>

    <!--State: Idle -->
    <div id="idle-state-view" style="display: none">
        <div id="counter-display-container">
            <H1>Record up to 60 minutes of your thoughts on any issue.</H1>
            <BR/>
            <BR>
        </div>
        <BR/>
        <div class="controls-container">
            <button id="record-button">Start Recording</button>
        </div>
    </div>

    <!--State: Recording -->
    <div id="recording-state-view" style="display: none">
        <div>
            <span id="counter-display">5</span>
        </div>
        <div class="controls-container">
            <button id="stop-button">Finish Recording</button>
        </div>
    </div>

    <!--State: Recording Complete / Preview -->
    <div id="recording-complete-state-view" style="display: none">
        <div>
            <audio id="previewControl" type="audio/mpeg" controls></audio>
        </div>
        <BR/>
        <div class="controls-container">
            <button id="save-button">Save</button>
            <button id="delete-button">Delete</button>
        </div>
    </div>

    <!--State: Creating -->
    <div id="creating-state-view" style="display: none">
        <div>
            <H1 id="creating-display">Creating new discussion. Please wait.....</H1>
        </div>
    </div>

    <!--State: Confirmation -->
    <div id="discussion-confirmation-state-view" style="display: none">
        <div>
            <H1 id="discussion-confirmation-title"></H1>
            <H2> Your discussion has been created</H2>
            <h3>Share this link to invite others to join your discussion -> <a id="discussion-confirmation-url"></a></h3>
            <p><a th:href="${baseURL}">Home</a></p>
        </div>
    </div>
</body>
</html>
