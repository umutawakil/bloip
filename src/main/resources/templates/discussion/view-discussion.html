<!DOCTYPE html>
<html layout:decorate="~{layouts/main-layout.html}">
    <head>
        <meta charset="UTF-8">
        <title th:text="${discussion.title}"/>
        <script type="text/javascript">
            var comments;
            var currentTrack; //set using serverside data
            var audioPlayer;
            var discussionId;

            /** TODO: The player should be able to skip bad urls **/

            $(document).ready(function() {
                audioPlayer = document.getElementById("comment-audio");

                initDiscussionComments();

                $("#previous-comment-button").click(function() {
                    previousComment();
                });

                $("#play-comment-button").click(function() {
                    resumeComment();
                });

                $("#pause-comment-button").click(function() {
                    pauseComment();
                });

                $("#next-comment-button").click(function() {
                    nextComment();
                });

                $("#reply-button").click(function() {
                    goToReplyPage(discussionId);
                });
            });

            /** This is triggered by the onplaying event directly in the doms onplaying attribute **/
            function showPlaying() {
                $("#play-comment-button").css("display", "none");
                $("#pause-comment-button").css("display","inline-block");
                updateTrackNumber();
            }

            /** Only triggered when all tracks are played **/
            function showStopped() {
                $("#play-comment-button").css("display", "inline-block");
                $("#pause-comment-button").css("display","none");
                updateTrackNumber();
            }

            function updateTrackNumber() {
                $("#comment-track-number").text("Track #" + (Number(currentTrack) + 1) + " / " + comments.length);
            }

            function initDiscussionComments() {
                discussionId   = $("#stash").attr("discussionId");
                currentTrack    = $("#stash").attr("currentTrack");

                $.ajax({
                    type: "get",
                    url: "/api/d/" +discussionId + "/comments",
                    error: function (request, error) {
                        alert(" Can't do because: " + error);
                    },
                    success: function (data) {
                        comments = data;

                        //alert(JSON.stringify(data));

                        console.log("Comments initialized: " + comments.length);

                        initCommentPlayer(comments);
                        updateTrackNumber();
                    }
                });
            }

            function initCommentPlayer(data) {
                if(currentTrack >= comments.length) { //This is for the rare case the last comment was deleted
                    currentTrack = comments.length - 1; // For all other deletions it should take care of itself because track one large becomes the new trackNumber naturally
                }

                if(data.length > 0) {
                    audioPlayer.src = data[0].audioUrl;
                    console.log("Player initialized.");
                } else {
                    alert("This discussion has no comments. Let us know about this bug!!!!!");
                }
            }

            function previousComment() {
                console.log("Previous comment");
                if(currentTrack <= 0) {
                    return;
                }
                currentTrack--;
                playComment();
            }

            function nextComment() {
                console.log("Next comment");
                currentTrack++;
                console.log("currentTrack: " + currentTrack + ", N = " + comments.length)
                if (currentTrack >= comments.length) {
                    currentTrack = 0;
                    showStopped();
                    return;
                }
                console.log("About to play next");
                playComment();
            }

            function playComment() {
                console.log("Playing comment: " + comments[currentTrack].audioUrl);
                audioPlayer.src = comments[currentTrack].audioUrl;

                audioPlayer.play().catch(function(err) {
                    handlePlayError(err);
                });
            }

            function resumeComment() {
                console.log("Resuming comment");
                audioPlayer.src = comments[currentTrack].audioUrl;
                audioPlayer.play().catch(function(err) {
                    handlePlayError(err);
                });
            }

            function handlePlayError(err) {
                console.log("Error");
                showStopped();
                document.getElementById("error").innerHTML = "Bad recording skipped.";
                console.log(err.message);

                setTimeout(function() {
                    document.getElementById("error").innerHTML = "";
                    nextComment();
                }, 1500);
            }

            function currentCommentFinished() {
                console.log("Current comment finished");
                currentTrack++;
                if(!finishPlaying()) {
                    playComment();
                }
            }

            function finishPlaying() {
                if(currentTrack >= comments.length) {
                    currentTrack = 0;
                    showStopped();
                    return true;
                }
                return false
            }

            function pauseComment() {
                console.log("Pausing comment");
                audioPlayer.pause();
                showStopped();
            }

            function goToReplyPage(discussionId) {
                window.location.href = "/reply/" + discussionId;
            }
        </script>
        <style>
            #comment-audio {
                display: none;
            }
            .seek-buttons {
                margin-right: 25px;
                margin-left: 25px;
            }
            #previous-comment-button {

            }

            #play-comment-button{
            }

            #pause-comment-button{

            }
            #pause-comment-button {
                display: none;
            }

            #next-comment-button{
            }

            #comment-track-number {
                margin-bottom: 10px;
                font-size: 1.5em;
            }

            #view-discussion-topic-container {
                font-size: 1.5em;
                margin-top: 50px;
                color: black;
            }
            #view-discussion-topic-container a {
                color: blue;
            }

            #reply-button-container {
                text-align: center;
                margin-top: 20px;
                overflow: hidden;
            }
            .view-discussion-controls {
                display: inline-block;
            }
            #reply-button {
                margin-left: 20px;
                margin-right: 20px;
                color: white;
                background-color: mediumpurple;
                box-shadow: 1.125px 2.5px gray;
            }
            .popularity-button {
                background-color: white;
                color: black;
                padding: 20px;
                text-align: center;
                text-decoration: none;
                border: 1px solid black;
                border-radius: 7px;
                font-size: 16px;
                margin: 4px 2px;
                max-width: 200px;
                min-width: 100px;
                cursor: pointer;
            }

            #dislike-button:hover {
                background-color: red;
                color: white;
                border-color: red;
            }

            #like-button:hover {
                background-color: green;
                color: white;
                border-color: green;
            }

            #view-discussion-container {
                text-align: center;
                min-height: 600px;
            }
            #view-discussion-player-container {
                margin-top: 40px;
            }
            .vd-player-control {
            }
            .vd-player-control:hover {
                cursor: pointer;
            }
            #vd-player-controls-container {
                display: inline-block;
            }
        </style>
    </head>
    <body>
    <th:block layout:fragment="content">
        <div id="view-discussion-container">
            <!-- This is purely for passing data from the server to js -->
            <span id="stash" th:attr="discussionId=${discussion.id},currentTrack=${currentTrack}" style="display: none"></span>

            <H1 th:text="${discussion.title}"/>
            <HR/>

            <div id="view-discussion-player-container">
                <audio id="comment-audio" onplaying="showPlaying()" onended="currentCommentFinished()" preload="none" controls>
                    <source id="comment-audio-source" type="audio/webm; codecs=opus">
                    Your browser does not support the audio element.
                </audio>
            </div>
            <div id="comment-track-number"></div>
            <table id="vd-player-controls-container">
                <tr>
                <td id="previous-comment-button" class="vd-player-control seek-buttons"><img src="/images/previous.png"></td>
                <td id="play-comment-button"     class="vd-player-control vd-play-stop-control">    <img src="/images/play-button.png"></td>
                <td id="pause-comment-button"    class="vd-player-control vd-play-stop-control">   <img src="/images/stop-button.png"></td>
                <td id="next-comment-button"     class="vd-player-control seek-buttons"><img src="/images/next.png"></td>
                </tr>
            </table>

            <div id="youtube-container" style="font-size: 2em;" th:if="${discussion.youtubeLink != null}">
                <a target="_blank" th:href="${discussion.youtubeLink}">Youtube Video</a>
            </div>
           <div id="view-discussion-topic-container">
                <span style="margin-right: 30px;">Topic</span><span style="margin-right: 30px;">-></span><a th:href="'/b/' + ${discussion.topic.friendlyId}" th:text="${discussion.topic.name}"/>
            </div>
            <BR/>
            <BR/>
            <div id="error"></div>
            <div id="reply-button-container">
                <!--<div id="like-button" class="view-discussion-controls popularity-button">Like</div>-->
                <div id="reply-button" class="standard-button view-discussion-controls">Reply</div>
                <!--<div id="dislike-button" class="view-discussion-controls popularity-button">Dislike</div>-->
            </div>
        </div>
        <HR/>
    </th:block>
    </body>
</html>
